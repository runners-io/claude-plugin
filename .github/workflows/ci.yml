name: ci

# The plugin's checks, on the copy a user installs from. A GitHub-hosted runner, never one of our own: this is a
# public repository, so a pull request from a fork can change what this file runs. It needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: manifest, bundle and tests
    # A pull request from a fork runs nothing here: only pushes, a person's dispatch, and pull requests from a branch
    # of this repository (which is how a release is published). A fork's pull request FAILS this check at its first
    # step instead of skipping it: a ruleset requires the check by name, and GitHub counts a skipped one as passing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: A pull request from a fork is refused
        # Before anything is checked out: nothing of the fork's is fetched or run. Every later step runs only if this
        # one passed.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::This check does not run for a pull request from a fork, so it fails here rather than passing unrun. A maintainer publishes changes from a branch of this repository."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the base branch is there for the new-version check below.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: A changed plugin is a new version
        # A pull request that changes the plugin must raise its version (every field, the check says which), so
        # each release can be installed and told apart by its version and tag. The check fails, never passes, when
        # the base is not in the checkout.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-plugin.mjs . --against "origin/$BASE_REF"

      - name: Install the channel's build tools
        working-directory: channel
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, rebuild, and require the committed bundle to match
        working-directory: channel
        run: |
          set -euo pipefail
          npm run typecheck
          # An untracked bundle makes the diff below silently empty: require it tracked first.
          git ls-files --error-unmatch dist/runners-io-channel.mjs >/dev/null
          npm run build
          git diff --exit-code --stat -- dist/

      - name: zsh, so the claude-gh detection is tested against a real zsh (macOS's default shell)
        run: command -v zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }

      - name: Tests (Node 24)
        working-directory: channel
        run: npm test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: The bundle end to end, the hooks and the setup checks, and the manifest's promises (Node 20)
        # The hooks are plain JavaScript run by whatever Node.js the user has, so their tests run on the oldest one too.
        run: |
          set -euo pipefail
          node scripts/check-plugin.mjs
          node --test channel/test/bundle.test.mjs channel/test/doctor.test.mjs channel/test/readiness.test.mjs channel/test/node-wrapper.test.mjs channel/test/session-start.test.mjs

      - name: claude plugin validate --strict
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          HOME="$home" npx -y @anthropic-ai/claude-code@2.1.317 plugin validate . --strict
